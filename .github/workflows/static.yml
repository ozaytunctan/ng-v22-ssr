
name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: |
          npx ng build \
            --project=ng-v22-ssr \
            --configuration=production \
            --base-href=/ng-v22-ssr/

      - name: Prepare Pages
        run: |
          cd dist/ng-v22-ssr/browser

          # Check build output
          if [ ! -f index.csr.html ] && [ ! -f index.html ]; then
            echo "Angular build output not found!"
            exit 1
          fi

          # Create root index.html if necessary
          if [ ! -f index.html ]; then
            cp index.csr.html index.html
          fi

          # Create GitHub Pages SPA fallback
          if [ -f index.csr.html ]; then
            cp index.csr.html 404.html
          else
            cp index.html 404.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ng-v22-ssr/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
